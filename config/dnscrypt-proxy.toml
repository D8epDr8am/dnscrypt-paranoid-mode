##############################################
# DNSCrypt-Proxy - Paranoid Privacy Config
# https://github.com/D8epDr8am/dnscrypt-paranoid
##############################################

listen_addresses = ['127.0.0.1:53', '[::1]:53']
max_clients = 250
user_name = 'dnscrypt-proxy'

ipv4_servers = true
ipv6_servers = false
block_ipv6 = true

dnscrypt_servers = true
doh_servers = true
odoh_servers = false

require_dnssec = true
require_nolog = true
require_nofilter = true

# Анонимизация через relay-серверы (можно отключить для скорости)
anonymized_dns = { routes = [
    { server_name='*', via=['anon-cs-fr', 'anon-cs-de', 'anon-cs-se', 'anon-cs-nl'] }
]}

# Автоматический выбор лучших серверов
# Раскомментируйте для ручного выбора:
# server_names = [
#     'cloudflare',
#     'quad9-dnscrypt-ip4-nofilter-pri',
#     'nixnet-uncensored-lv',
#     'scaleway-fr'
# ]

lb_strategy = 'p2'
lb_estimator = true

cache = true
cache_size = 8192
cache_min_ttl = 2400
cache_max_ttl = 86400
cache_neg_min_ttl = 60
cache_neg_max_ttl = 600

timeout = 5000
keepalive = 30
netprobe_timeout = 60
netprobe_address = '9.9.9.9:53'

fallback_resolvers = ['9.9.9.9:53', '1.1.1.1:53']
ignore_system_dns = true

cert_refresh_delay = 240
dnscrypt_ephemeral_keys = true
tls_disable_session_tickets = true
tls_cipher_suite = [52392, 49199]

[blocked_names]
blocked_names_file = '/etc/dnscrypt-proxy/blocked-names.txt'
log_file = '/var/log/dnscrypt-proxy/blocked-names.log'

[blocked_ips]
blocked_ips_file = '/etc/dnscrypt-proxy/blocked-ips.txt'
log_file = '/var/log/dnscrypt-proxy/blocked-ips.log'

[query_log]
file = '/var/log/dnscrypt-proxy/query.log'
format = 'tsv'
ignored_qtypes = ['DNSKEY', 'NS']

[nx_log]
file = '/var/log/dnscrypt-proxy/nx.log'
format = 'tsv'

[sources]
  [sources.'public-resolvers']
  urls = ['https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md', 'https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md']
  cache_file = '/var/cache/dnscrypt-proxy/public-resolvers.md'
  minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
  refresh_delay = 72
  prefix = ''

  [sources.'relays']
  urls = ['https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/relays.md', 'https://download.dnscrypt.info/resolvers-list/v3/relays.md']
  cache_file = '/var/cache/dnscrypt-proxy/relays.md'
  minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
  refresh_delay = 72
  prefix = ''
